$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
type: command
name: sms_evaluate_model
display_name: Evaluate model on the fixed test set
description: Scores an MLflow model on a labeled CSV and writes metrics.json (accuracy, precision, recall, F1 for spam).
version: "1"

inputs:
  model:
    type: mlflow_model
  test_data:
    type: uri_file
  label_column:
    type: string
    default: label
  positive_label:
    type: string
    default: spam

outputs:
  metrics:
    type: uri_folder

code: ../src
# Registered by the notebook from the AutoML model's own conda.yaml, so the model loads exactly as trained.
environment: azureml:sms-automl-env@latest
command: >-
  python evaluate.py
  --model ${{inputs.model}}
  --test_data ${{inputs.test_data}}
  --label_column ${{inputs.label_column}}
  --positive_label ${{inputs.positive_label}}
  --metrics_out ${{outputs.metrics}}
