# GitHub Actions workflow for the Azure MLOps loop.
#
# To use it, copy this file to .github/workflows/azure-mlops.yml in your repository, then set:
#   Secrets   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID   (a federated credential, see README)
#   Variables AZURE_RESOURCE_GROUP, AZURE_ML_WORKSPACE, AZURE_ML_ENDPOINT
#   An environment called "production" with required reviewers (Settings > Environments)
#
# It only runs when started by hand (Actions > azure-mlops > Run workflow), never on push.

name: azure-mlops

on:
  workflow_dispatch:
    inputs:
      challenger_name:
        description: Registered model to evaluate (the challenger)
        required: true
        default: sms_real_1k
      challenger_version:
        description: Its version
        required: true
        default: "1"
      champion_name:
        description: Current production model (the champion)
        required: true
        default: balanced_model
      champion_version:
        description: Its version
        required: true
        default: "1"
      canary_percent:
        description: Share of traffic for the challenger if it passes
        required: true
        default: "10"

permissions:
  id-token: write   # for azure/login with OpenID Connect
  contents: read

env:
  WORKDIR: azure-mlops

jobs:
  test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest flake8
      - run: flake8 --max-line-length 120 src tests
        working-directory: ${{ env.WORKDIR }}
      - run: python -m pytest -q tests
        working-directory: ${{ env.WORKDIR }}

  evaluate:
    name: Evaluate and gate in Azure ML
    needs: test
    runs-on: ubuntu-latest
    outputs:
      promote: ${{ steps.decision.outputs.promote }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Set up the Azure ML CLI
        run: |
          az extension add --name ml --yes
          az configure --defaults group=${{ vars.AZURE_RESOURCE_GROUP }} workspace=${{ vars.AZURE_ML_WORKSPACE }}
      - name: Run the evaluate-and-gate pipeline
        id: run
        working-directory: ${{ env.WORKDIR }}
        run: |
          RUN=$(az ml job create --file pipelines/evaluate-and-gate.yml \
            --set inputs.champion_model.path=azureml:${{ inputs.champion_name }}:${{ inputs.champion_version }} \
            --set inputs.challenger_model.path=azureml:${{ inputs.challenger_name }}:${{ inputs.challenger_version }} \
            --query name --output tsv)
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          az ml job stream --name "$RUN"
          STATUS=$(az ml job show --name "$RUN" --query status --output tsv)
          echo "Pipeline status: $STATUS"
          test "$STATUS" = "Completed"
      - name: Read the gate decision
        id: decision
        run: |
          az ml job download --name ${{ steps.run.outputs.run }} --output-name decision --download-path decision
          FILE=$(find decision -name decision.json | head -n 1)
          cat "$FILE"
          PROMOTE=$(python -c "import json; print(str(json.load(open('$FILE'))['promote']).lower())")
          echo "promote=$PROMOTE" >> "$GITHUB_OUTPUT"
          echo "### Gate decision: promote = $PROMOTE" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Canary rollout to production
    needs: evaluate
    if: needs.evaluate.outputs.promote == 'true'
    runs-on: ubuntu-latest
    environment: production   # pauses here until a reviewer approves
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy the challenger to the green slot
        working-directory: ${{ env.WORKDIR }}
        run: |
          az extension add --name ml --yes
          az configure --defaults group=${{ vars.AZURE_RESOURCE_GROUP }} workspace=${{ vars.AZURE_ML_WORKSPACE }}
          MODEL=azureml:${{ inputs.challenger_name }}:${{ inputs.challenger_version }}
          if az ml online-deployment show --name green --endpoint-name ${{ vars.AZURE_ML_ENDPOINT }} > /dev/null 2>&1; then
            az ml online-deployment update --file endpoints/deployment.yml \
              --set name=green endpoint_name=${{ vars.AZURE_ML_ENDPOINT }} model=$MODEL
          else
            az ml online-deployment create --file endpoints/deployment.yml \
              --set name=green endpoint_name=${{ vars.AZURE_ML_ENDPOINT }} model=$MODEL
          fi
      - name: Send a canary share of traffic to green
        run: |
          CANARY=${{ inputs.canary_percent }}
          az ml online-endpoint update --name ${{ vars.AZURE_ML_ENDPOINT }} \
            --traffic "blue=$((100 - CANARY)) green=$CANARY"
          echo "### Canary: green now gets $CANARY% of traffic" >> "$GITHUB_STEP_SUMMARY"
